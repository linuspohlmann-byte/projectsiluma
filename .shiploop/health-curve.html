<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>ShipLoop — ProjectSiluma</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #e2e8f0; margin: 0; padding: 32px; }

    .label { fill: #94a3b8; font-size: 11px; }

<body>

    <line class="line-ship" x1="40" y1="48" x2="380" y2="48" />
    <text class="label" x="40" y="42">ship threshold (98)</text>
    <polyline class="line-curve" points="40,155 380,108" />
    <circle class="dot" cx="40" cy="155" r="5" />
    <circle class="dot" cx="380" cy="108" r="5" />
    <text class="label" x="28" y="162">35</text>
    <text class="label" x="368" y="115">72</text>
